name: Test local protocol and archive
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'examples/**'
      - 'site/**'
      - 'schemas/**'
      - 'taxonomy/**'
      - 'prompts/**'
      - 'llms.txt'
      - 'agent-guide.md'
      - 'pyproject.toml'
      - 'requirements.lock'
      - '.github/workflows/**'
permissions:
  contents: read
jobs:
  test:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m unittest discover -s tests -v
          python examples/local_demo.py --out .demo
          python examples/local_demo_v2.py --out .demo-v2
          python examples/local_demo_v3.py --out .demo-v3
          python examples/local_demo_v4.py --out .demo-v4
          preprints build --out _site
      - name: Verify public source reads outside the token repository
        run: python examples/check_public_source.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
