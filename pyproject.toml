[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-preprints"
version = "5.0.0"
description = "A GitHub-native Markdown preprint archive with verifiable admission proofs"
requires-python = ">=3.11"
dependencies = ["markdown-it-py==4.2.0", "mdit-py-plugins==0.6.1", "latex2mathml==3.81.1", "Pillow==12.3.0"]

[project.scripts]
preprints = "agent_preprints.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
